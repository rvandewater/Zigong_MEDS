[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Zigong-MEDS"
# Bump with `uv version --bump patch|minor|major`, then tag the commit with the same version.
version = "0.6.0"
authors = [
  { name="Robin van de Water", email="rpv2114@cumc.columbia.edu" },
]
description = "An ETL pipeline to extract the Zigong Fourth People's Hospital ICU infection database into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract 0.9's own interpreter range; a looser range here admits interpreters it
# cannot be installed on.
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# The whole ETL is `event_configs.yaml`, run by MEDS-Extract's own `meds-extract-run`, and the
# suMEDS rules in `sumeds_rules.yaml`; there is no Python of its own (suMEDS's
# `sumeds_link_unit_siblings` post-stage, 0.6.6, replaced `zigong_unit_metadata`). The
# `[download]` extra adds `meds-extract-download` (httpx + tenacity), which the runner
# spawns to stage the raw data. MEDS-transforms, polars and hydra all arrive through it
# at the versions it fences; duplicating those pins here would only create drift.
#
# This config uses MEDS-Extract 0.8's `_table.joins` key, which earlier releases cannot read, and
# declares an extension stage (`etl.post_stages`) and the `dataset.json` descriptors under `etl:`,
# both new in 0.8.1. The floor is 0.9.0 because it writes each code's `unit` in
# `metadata/codes.parquet` as one String and fails on a code with more than one unit
# (MEDS_extract#336); 0.8.x writes a list of the units seen. The cap sits below the next minor because
# MEDS-Extract 0.x minors are breaking (MESSY syntax, runner CLI), so raise it deliberately when
# migrating.
#
# suMEDS 0.6.2 registers the `sumeds_enrich` stage the spec declares, which enriches the code
# metadata with the rules registered below, soft-fails (a site without internet still gets its
# ETL) and records in `metadata/dataset.json` whether the build was enriched; it is capped below the
# next minor for the same reason (its rules format and CLI are still 0.x).
# suMEDS 0.6.9 adds the `link_single_units` option of `sumeds_link_unit_siblings`, which the spec
# sets.
dependencies = [
    # 0.9.2 is the first MEDS-Extract release that reads the spec's
    # `etl.cleanup_intermediates` (mmcdermott/MEDS_extract#340).
    "meds-extract[download]>=0.9.2,<0.10",
    # suMEDS 0.6.10 ships `UnitComponentContract`, which tests/test_unit_component.py runs on the
    # spec; 0.6.11 adds its `require_unit_in_code` option, which that test sets.
    "sumeds>=0.6.11,<0.7",
]

[dependency-groups]
# `shfmt-py` bundles the `shfmt` binary that the `mdformat-shfmt` pre-commit hook shells out to;
# declaring it here keeps local and CI behavior in lock step. `pyyaml` is read by the e2e test to
# enumerate the config's event blocks. MESSY-synth (Python >= 3.12) is installed by its own CI
# workflow rather than here, so the dev group still resolves on Python 3.11.
dev = [
    # `UnitComponentContract` (tests/test_unit_component.py) and the dftly it evaluates the spec with.
    "sumeds[testing]>=0.6.11,<0.7",
    "pre-commit~=3.8",
    "ruff>=0.11,<1.0",
    "pytest~=9.0",
    "pyyaml>=6.0",
    "shfmt-py==3.12.0.2",
]

# Registers this dataset with MEDS-Extract's generic runner: `meds-extract-run spec=Zigong` runs the
# whole ETL.
[project.entry-points."MEDS_extract.pipelines"]
Zigong = "Zigong_MEDS:event_configs.yaml"

# Registers the suMEDS rules under the same name, so the spec's `sumeds_enrich` stage and
# `--rules Zigong` find them.
[project.entry-points."sumeds.rules"]
Zigong = "Zigong_MEDS:sumeds_rules.yaml"

[project.urls]
Homepage = "https://github.com/rvandewater/ZIGONG_MEDS"
Issues = "https://github.com/rvandewater/ZIGONG_MEDS/issues"
Dataset = "https://physionet.org/content/icu-infection-zigong-fourth/1.1/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["Zigong_MEDS*"]

[tool.setuptools.package-data]
Zigong_MEDS = ["*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary operator suggestions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
